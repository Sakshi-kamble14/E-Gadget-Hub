<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Waste Report - Collection Point</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f4f4;
        }
        h1 {
            text-align: center;
            color: #2563eb;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }
        th {
            background-color: #2563eb;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
        .back-btn:hover {
            background: #1e40af;
        }
    </style>
</head>
<body>

    <h1>All E-Waste Report</h1>

    <table>
        <thead>
            <tr>
                <th>Inventory ID</th>
                <th>E-Waste Type</th>
                <th>Quantity</th>
                <th>Status</th>
                <th>Date Added</th>
            </tr>
        </thead>
        <tbody id="ewaste-table-body">
            <tr><td colspan="5">Loading data...</td></tr>
        </tbody>
    </table>

    <div style="text-align:center;">
        <a href="collector.html" class="back-btn">Back to Dashboard</a>
    </div>

    <script>
        // Fetch data from the servlet
        document.addEventListener("DOMContentLoaded", () => {
            fetch("CollectorReportServlet")
                .then(response => response.text())
                .then(html => {
                    document.getElementById("ewaste-table-body").innerHTML = html;
                })
                .catch(err => {
                    document.getElementById("ewaste-table-body").innerHTML =
                        `<tr><td colspan='5' style="color:red;">Error loading data: ${err}</td></tr>`;
                });
        });
    </script>

</body>
</html>
