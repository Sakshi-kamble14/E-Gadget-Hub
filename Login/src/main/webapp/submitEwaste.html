<!DOCTYPE html>
<html>
<head>
    <title>Submit E-Waste</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #6dd5ed, #2193b0);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background-color: #fff;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            width: 400px;
            text-align: center;
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        h2 {
            margin-bottom: 25px;
            color: #333;
        }
        input[type=text], input[type=number] {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: border 0.3s;
        }
        input[type=text]:focus, input[type=number]:focus {
            border: 2px solid #2193b0;
        }
        input[type=submit] {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2193b0;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        input[type=submit]:hover {
            background: #6dd5ed;
            transform: scale(1.05);
        }
        a {
            text-decoration: none;
            color: #2193b0;
            font-weight: 500;
        }
        a:hover {
            color: #6dd5ed;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Submit Your E-Waste</h2>
        <form action="SubmitEwasteServlet" method="post">
            <input type="text" name="ewasteType" placeholder="Enter E-Waste Type" required>
            <input type="number" name="quantity" placeholder="Enter Quantity" required>
            <input type="submit" value="Submit">
        </form>
        <p><a href="report.html">View Reports</a></p>
    </div>
</body>
</html>
