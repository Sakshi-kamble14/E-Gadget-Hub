<!DOCTYPE html>
<html>
<head>
    <title>Preview Complaints</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin:0; font-family:'Roboto'; background: linear-gradient(135deg,#ff9a9e,#fad0c4); display:flex; justify-content:center; align-items:center; height:100vh;}
        .card { background:#fff; padding:40px 30px; border-radius:15px; box-shadow:0 8px 25px rgba(0,0,0,0.2); width:500px; text-align:center; transition: transform 0.3s;}
        .card:hover { transform: translateY(-5px);}
        h2 { margin-bottom:25px; color:#333;}
        input[type=text] { width:100%; padding:12px 15px; margin:10px 0 20px 0; border:1px solid #ccc; border-radius:8px; outline:none; transition:border 0.3s;}
        input[type=text]:focus { border:2px solid #ff9a9e;}
        input[type=submit] { width:100%; padding:12px; border:none; border-radius:8px; background:#ff9a9e; color:#fff; font-size:16px; cursor:pointer; transition:background 0.3s, transform 0.2s;}
        input[type=submit]:hover { background:#fad0c4; transform: scale(1.05);}
    </style>
</head>
<body>
    <div class="card">
        <h2>Preview Complaints</h2>
        <form action="PreviewComplaintsServlet" method="post">
            <input type="text" name="userID" placeholder="Enter User ID" required>
            <input type="submit" value="Preview Complaints">
        </form>
    </div>
</body>
</html>
