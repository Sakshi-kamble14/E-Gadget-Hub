<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Complaint | E-Waste Management</title>

<style>
/* ===============================
   🌈 Animated Gradient Background
   =============================== */
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  font-family: "Poppins", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: linear-gradient(120deg, #0f2027, #203a43, #2c5364, #182848);
  background-size: 400% 400%;
  animation: gradientShift 12s ease infinite;
}
@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ✨ Floating Particles */
.particles {
  position: absolute;
  width: 100%;
  height: 100%;
  overflow: hidden;
  z-index: 0;
}
.particles span {
  position: absolute;
  display: block;
  width: 15px;
  height: 15px;
  background: rgba(255,255,255,0.1);
  animation: float 20s linear infinite;
  bottom: -150px;
  border-radius: 50%;
}
@keyframes float {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
}
.particles span:nth-child(1) { left: 10%; width: 10px; height: 10px; animation-delay: 0s; }
.particles span:nth-child(2) { left: 30%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 18s; }
.particles span:nth-child(3) { left: 50%; width: 8px; height: 8px; animation-delay: 4s; animation-duration: 22s; }
.particles span:nth-child(4) { left: 70%; width: 25px; height: 25px; animation-delay: 1s; animation-duration: 20s; }
.particles span:nth-child(5) { left: 90%; width: 15px; height: 15px; animation-delay: 3s; animation-duration: 24s; }

/* ===============================
   💎 Glass Form Container
   =============================== */
.container {
  position: relative;
  z-index: 1;
  width: 400px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(15px);
  padding: 40px;
  text-align: center;
  color: #fff;
  transition: transform 0.4s ease;
}
.container:hover {
  transform: scale(1.03);
}
h2 {
  font-size: 28px;
  margin-bottom: 25px;
  color: #00ffd5;
  letter-spacing: 1px;
  text-shadow: 0 0 10px #00ffd5;
}

/* ===============================
   🪶 Floating Label Form Fields
   =============================== */
.input-group {
  position: relative;
  margin-bottom: 30px;
}
.input-group input,
.input-group textarea {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  color: #fff;
  border: none;
  border-bottom: 2px solid #ccc;
  background: transparent;
  outline: none;
  transition: 0.3s;
}
.input-group label {
  position: absolute;
  left: 10px;
  top: 12px;
  color: #bbb;
  font-size: 15px;
  pointer-events: none;
  transition: 0.3s;
}
.input-group input:focus,
.input-group textarea:focus {
  border-bottom-color: #00ffd5;
  box-shadow: 0 1px 10px rgba(0, 255, 213, 0.4);
}
.input-group input:focus + label,
.input-group input:valid + label,
.input-group textarea:focus + label,
.input-group textarea:valid + label {
  top: -10px;
  left: 5px;
  font-size: 13px;
  color: #00ffd5;
}

/* ===============================
   🚀 Submit Button
   =============================== */
button {
  width: 100%;
  background: linear-gradient(90deg, #00ffd5, #00b3ff);
  border: none;
  padding: 12px;
  border-radius: 30px;
  color: #0f2027;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(0,255,213,0.4);
  transition: all 0.3s;
}
button:hover {
  background: linear-gradient(90deg, #00b3ff, #00ffd5);
  box-shadow: 0 0 20px rgba(0,255,213,0.7);
  transform: translateY(-3px);
}

/* ===============================
   ✅ Message Display
   =============================== */
.msg {
  margin-top: 20px;
  font-weight: bold;
  font-size: 15px;
}
.success { color: #00ffd5; }
.error { color: #ff5c5c; }

/* ===============================
   📱 Responsive Design
   =============================== */
@media(max-width: 480px) {
  .container {
    width: 90%;
    padding: 30px 25px;
  }
}
</style>
</head>
<body>

<!-- 🌟 Floating Particles Background -->
<div class="particles">
  <span></span><span></span><span></span><span></span><span></span>
</div>

<!-- 💎 Complaint Form -->
<div class="container">
  <h2>📣 Submit a Complaint</h2>

  <form action="ComplaintServlet" method="post">
    <div class="input-group">
      <input type="text" name="subject" id="subject" required>
      <label for="subject">Complaint Subject</label>
    </div>

    <div class="input-group">
      <textarea name="description" id="description" rows="4" required></textarea>
      <label for="description">Complaint Description</label>
    </div>

    <button type="submit">Submit Complaint</button>
  </form>

  <div class="msg">
    <script>
      const params = new URLSearchParams(window.location.search);
      const status = params.get('status');
      if (status === 'success')
        document.write('<p class="success">✅ Complaint submitted successfully!</p>');
      else if (status === 'error')
        document.write('<p class="error">❌ Failed to submit complaint. Please try again.</p>');
    </script>
  </div>
</div>

</body>
</html>
